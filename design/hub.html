<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Umbler Hub — mockups</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://use.typekit.net/xfo2jkh.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
/* ═══════════════ SKIN TOKENS ═══════════════
   One DOM, three skins. ?skin=aurora|panes|signal  &theme=dark|light  (or Alt+1/2/3, and the switcher in the status bar) */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--fast:140ms;--med:260ms;--slow:520ms;
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--font-mono:'JetBrains Mono','SF Mono',Consolas,monospace}

/* ── Aurora (Umbler DS tokens; radius 8 control / 16 island, pill chips) ── */
[data-skin=aurora]{--r:8px;--r-lg:16px;--r-chip:9999px;--gap:16px;--gap-main:12px;--pad:8px;--ctl:32px;--row-h:46px;
  --font-title:'p22-mackinac-pro','Newsreader',Georgia,serif;--title-size:19px;--title-style:normal;--title-case:none;
  --swoosh:linear-gradient(90deg,#8BBCF8 0%,#F8C4B8 100%)}
[data-skin=aurora].dark{--bg-page:#000;--bg-surface:#131416;--bg-elevated:#1B1E23;--border-default:#29292D;--border-strong:#3E3E43;
  --text-primary:#fff;--text-secondary:#A0AEC0;--text-tertiary:#7C839C;--accent:#1A5CFF;--accent-hover:#0044D9;--accent-text:#6B99FF;--on-accent:#fff;
  --accent-soft:rgba(26,92,255,.18);--hover-tint:rgba(255,255,255,.06);--press-tint:rgba(255,255,255,.10);--sel-bg:rgba(255,255,255,.06);--sel-fg:#fff;
  --ok:#61EED5;--warn:#E5A93C;--err:#FF552F;--i1:#6B99FF;--i2:#61EED5;--i3:#F8C4B8;--i4:#D6B6FF;--i5:#E5A93C;
  --shadow-pop:0 12px 32px rgba(0,0,0,.55);--ring:0 0 0 3px rgba(61,116,255,.45);--scroll:rgba(255,255,255,.12);--scroll-h:rgba(255,255,255,.26);
  --field:radial-gradient(1100px 560px at 88% -8%,rgba(26,92,255,.16),transparent 62%),radial-gradient(900px 520px at -4% 112%,rgba(214,182,255,.08),transparent 60%)}
[data-skin=aurora].light{--bg-page:#fff;--bg-surface:#F0F2F5;--bg-elevated:#fff;--border-default:#E3E5EA;--border-strong:#D1D1D1;
  --text-primary:#121316;--text-secondary:#575B6B;--text-tertiary:#8F97AB;--accent:#1A5CFF;--accent-hover:#0044D9;--accent-text:#1A5CFF;--on-accent:#fff;
  --accent-soft:rgba(26,92,255,.12);--hover-tint:rgba(0,0,0,.05);--press-tint:rgba(0,0,0,.09);--sel-bg:rgba(18,19,22,.08);--sel-fg:#121316;
  --ok:#0F9F85;--warn:#B77A0C;--err:#E2411C;--i1:#1A5CFF;--i2:#0F9F85;--i3:#D2573A;--i4:#8250DF;--i5:#B77A0C;
  --shadow-pop:0 8px 24px rgba(10,15,32,.16);--ring:0 0 0 3px rgba(61,116,255,.45);--scroll:rgba(0,0,0,.16);--scroll-h:rgba(0,0,0,.30);
  --field:radial-gradient(1100px 560px at 88% -8%,rgba(26,92,255,.10),transparent 62%),radial-gradient(900px 520px at -4% 112%,rgba(214,182,255,.12),transparent 60%)}

/* ── Panes — flat IDE panes, ONE radius (4px), no pills, no floating islands ── */
[data-skin=panes]{--r:4px;--r-lg:4px;--r-chip:4px;--gap:0px;--gap-main:0px;--pad:10px;--ctl:28px;--row-h:40px;
  --font-title:var(--font-ui);--title-size:13px;--title-style:normal;--title-case:none;--field:none}
[data-skin=panes].dark{--bg-page:#0D0E11;--bg-surface:#121317;--bg-elevated:#1B1D23;--border-default:#23252C;--border-strong:#363943;
  --text-primary:#E8EAEE;--text-secondary:#9AA1B2;--text-tertiary:#697082;--accent:#4C8DFF;--accent-hover:#6AA0FF;--accent-text:#7BA9FF;--on-accent:#06080F;
  --accent-soft:rgba(76,141,255,.16);--hover-tint:rgba(255,255,255,.05);--press-tint:rgba(255,255,255,.09);--sel-bg:rgba(76,141,255,.14);--sel-fg:#fff;
  --ok:#3DD68C;--warn:#F0B23C;--err:#FF5C5C;--i1:#6AA0FF;--i2:#3DD68C;--i3:#FF9B6A;--i4:#C39BFF;--i5:#F0B23C;
  --shadow-pop:0 10px 28px rgba(0,0,0,.5);--ring:0 0 0 2px rgba(76,141,255,.55);--scroll:rgba(255,255,255,.10);--scroll-h:rgba(255,255,255,.22)}
[data-skin=panes].light{--bg-page:#F4F4F1;--bg-surface:#fff;--bg-elevated:#fff;--border-default:#E4E4DF;--border-strong:#CFCFC7;
  --text-primary:#17181B;--text-secondary:#5B5F69;--text-tertiary:#8E929C;--accent:#1F5EFF;--accent-hover:#0F47D6;--accent-text:#1F5EFF;--on-accent:#fff;
  --accent-soft:rgba(31,94,255,.10);--hover-tint:rgba(0,0,0,.04);--press-tint:rgba(0,0,0,.08);--sel-bg:rgba(31,94,255,.10);--sel-fg:#0F2E8F;
  --ok:#14915E;--warn:#A56B00;--err:#D63636;--i1:#1F5EFF;--i2:#14915E;--i3:#C2552B;--i4:#7B4FD6;--i5:#A56B00;
  --shadow-pop:0 8px 24px rgba(0,0,0,.14);--ring:0 0 0 2px rgba(31,94,255,.45);--scroll:rgba(0,0,0,.14);--scroll-h:rgba(0,0,0,.28)}

/* ── Signal — hard edges, mono labels, inverted selection (dark = amber on black, light = vermilion on paper) ── */
[data-skin=signal]{--r:0px;--r-lg:0px;--r-chip:0px;--gap:0px;--gap-main:0px;--pad:12px;--ctl:28px;--row-h:42px;
  --font-title:var(--font-mono);--title-size:12px;--title-style:normal;--title-case:uppercase;--field:none}
[data-skin=signal].dark{--bg-page:#0A0A0B;--bg-surface:#0A0A0B;--bg-elevated:#151517;--border-default:#26262A;--border-strong:#4A4A50;
  --text-primary:#F2F2EF;--text-secondary:#A4A49E;--text-tertiary:#6C6C67;--accent:#FFB224;--accent-hover:#FFC456;--accent-text:#FFB224;--on-accent:#0A0A0B;
  --accent-soft:rgba(255,178,36,.13);--hover-tint:rgba(255,255,255,.05);--press-tint:rgba(255,255,255,.10);--sel-bg:#FFB224;--sel-fg:#0A0A0B;
  --ok:#5CF29A;--warn:#FF8A3D;--err:#FF4D4D;--i1:#5CC8FF;--i2:#5CF29A;--i3:#FF8AD8;--i4:#B79CFF;--i5:#FFB224;
  --shadow-pop:none;--ring:0 0 0 2px #FFB224;--scroll:rgba(255,255,255,.14);--scroll-h:rgba(255,255,255,.3)}
[data-skin=signal].light{--bg-page:#F2EFE8;--bg-surface:#F2EFE8;--bg-elevated:#FBF9F4;--border-default:#D9D4C7;--border-strong:#141414;
  --text-primary:#141414;--text-secondary:#4D4A42;--text-tertiary:#8A8578;--accent:#E5391A;--accent-hover:#C42E13;--accent-text:#D02F12;--on-accent:#FFF;
  --accent-soft:rgba(229,57,26,.09);--hover-tint:rgba(20,20,20,.05);--press-tint:rgba(20,20,20,.10);--sel-bg:#141414;--sel-fg:#F2EFE8;
  --ok:#1E8E4E;--warn:#B96A00;--err:#C8231A;--i1:#1B6FD1;--i2:#1E8E4E;--i3:#C2185B;--i4:#6B3FD0;--i5:#B96A00;
  --shadow-pop:none;--ring:0 0 0 2px #E5391A;--scroll:rgba(0,0,0,.18);--scroll-h:rgba(0,0,0,.35)}

/* ═══════════════ BASE ═══════════════ */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font-ui);font-size:14px;color:var(--text-primary);background:var(--bg-page);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono{font-family:var(--font-mono)}
.theming,.theming *,.theming *::before{transition:background-color .38s ease,color .38s ease,border-color .38s ease,fill .38s ease!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:calc(var(--r)*1.25);border:3px solid transparent;background-clip:padding-box;transition:background .2s}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-h);border-width:2px}
::-webkit-scrollbar-track{background:transparent}
.stagebg{position:fixed;inset:0;background:var(--field);background-size:140% 140%;pointer-events:none;animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0 0}to{background-position:18% 10%}}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.985)}}
@keyframes enterX{from{opacity:0;transform:translateX(-10px)}}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}}
@keyframes flash{from{background:var(--accent-soft)}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes ripple{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes bump{40%{transform:scale(1.28);color:var(--accent-text)}}
@keyframes sheen{from{background-position:-120% 0}to{background-position:220% 0}}
@keyframes chipPulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}100%{box-shadow:0 0 0 10px transparent}}
.enter{animation:enter .62s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms)}
.enterX{animation:enterX .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms)}
.bump{display:inline-block;animation:bump .45s var(--spring)}

/* ═══════════════ SHELL ═══════════════ */
.app{--rail-w:clamp(272px,24vw,332px);position:relative;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);column-gap:var(--gap);height:100%;padding:var(--gap);
  transition:grid-template-columns .5s var(--ease),column-gap .5s var(--ease)}
.app.collapsed{grid-template-columns:0px minmax(0,1fr);column-gap:0}
.island{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-lg)}
.rail{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;padding:var(--pad);transition:opacity .35s var(--ease),transform .5s var(--ease)}
.app.collapsed .rail{opacity:0;transform:translateX(-16px);pointer-events:none;border-width:0;padding-inline:0}
.main{display:flex;flex-direction:column;gap:var(--gap-main);min-width:0;min-height:0}
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--bg-page) 60%,transparent);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}

/* flat skins: panes divided by hairlines, not floating cards */
[data-skin=panes] .island,[data-skin=signal] .island{border:0;border-radius:0;box-shadow:none}
[data-skin=panes] .rail,[data-skin=signal] .rail{border-right:1px solid var(--border-default)}
[data-skin=signal] .rail{border-right-color:var(--border-strong)}
[data-skin=panes] .toolbar,[data-skin=signal] .toolbar{border-bottom:1px solid var(--border-default)}
[data-skin=signal] .toolbar{border-bottom-color:var(--border-strong)}
[data-skin=panes] .stage,[data-skin=signal] .stage{background:var(--bg-page)}

/* ═══════════════ ICON BUTTON / KBD / TOOLTIP ═══════════════ */
.ib{--sz:var(--ctl);position:relative;display:inline-grid;place-items:center;width:var(--sz);height:var(--sz);flex:none;padding:0;border:0;border-radius:var(--r);background:transparent;
  color:var(--text-tertiary);font-size:16px;cursor:pointer;transition:background var(--fast) var(--ease),color var(--fast) var(--ease),transform var(--med) var(--spring)}
.ib i{transition:transform var(--med) var(--spring)}
.ib:hover{background:var(--hover-tint);color:var(--text-primary)}
.ib:hover i{transform:scale(1.1)}
.ib:active{background:var(--press-tint);transform:scale(.9)}
.ib:focus-visible{outline:0;box-shadow:var(--ring)}
.ib[aria-pressed=true]{background:var(--sel-bg);color:var(--sel-fg)}
[data-skin=signal] .ib[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.ib.sm{--sz:calc(var(--ctl) - 6px);font-size:14px}
.ib.danger:hover{color:var(--err)}
.ib:disabled{opacity:.35;pointer-events:none}
.kbd{font:500 10.5px/1 var(--font-mono);padding:3px 5px;border:1px solid var(--border-strong);border-radius:max(2px,calc(var(--r) - 4px));color:var(--text-secondary)}
#tip{position:fixed;z-index:100;pointer-events:none;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border-strong);border-radius:var(--r);box-shadow:var(--shadow-pop);font:500 12px/1.2 var(--font-ui);opacity:0;transform:translateY(3px) scale(.96);
  transition:opacity .14s var(--ease),transform .2s var(--spring);white-space:nowrap}
#tip.on{opacity:1;transform:none}
#tip.nokbd{padding-right:10px}
[data-skin=signal] #tip{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em}

/* ═══════════════ RAIL ═══════════════ */
.rail-head{display:flex;align-items:center;gap:4px;padding:2px 2px 8px 6px;flex:none}
.rail-head img{width:22px;height:22px;margin-right:6px;transition:transform .6s var(--spring)}
.rail-head:hover img{transform:rotate(-12deg) scale(1.1)}
.rail-head h1{font:500 var(--title-size)/1.2 var(--font-title);font-style:var(--title-style);text-transform:var(--title-case);letter-spacing:-.02em;margin:0;flex:1;white-space:nowrap}
[data-skin=aurora] .rail-head h1 span{background:var(--swoosh);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-skin=aurora].light .rail-head h1 span{background:none;color:var(--text-primary)}
[data-skin=panes] .rail-head h1,[data-skin=signal] .rail-head h1{font-weight:600;letter-spacing:0}
[data-skin=signal] .rail-head img{display:none}
[data-skin=signal] .rail-head h1::before{content:'■ ';color:var(--accent)}
.field{display:flex;align-items:center;gap:8px;height:var(--ctl);padding:0 8px 0 10px;border:1px solid var(--border-default);border-radius:var(--r);color:var(--text-tertiary);margin:0;
  transition:border-color .2s,box-shadow .25s var(--ease),background .2s;min-width:0}
.field:hover{border-color:var(--border-strong)}
.field:focus-within{border-color:var(--accent);box-shadow:var(--ring);color:var(--text-secondary)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text-primary);font:400 13px var(--font-ui)}
.field input::placeholder{color:var(--text-tertiary)}
.rail .field{margin-bottom:8px;flex:none}
.rail{container-type:inline-size;container-name:rl}
@container rl (max-width:290px){.rail .field .kbd{display:none}}
.tree{flex:1;overflow:auto;min-height:0;margin:0 calc(var(--pad)*-.5);padding:0 calc(var(--pad)*.5)}
.tree-in{position:relative;padding-bottom:8px}
#selector{position:absolute;left:0;right:0;top:0;height:0;border-radius:var(--r);background:var(--sel-bg);pointer-events:none;opacity:0;
  transition:top .45s var(--spring),height .35s var(--ease),opacity .25s}
[data-skin=panes] #selector{box-shadow:inset 2px 0 0 var(--accent)}
.wtg{margin-bottom:6px}
.wtg-h{position:relative;display:flex;align-items:center;gap:4px;min-height:34px;padding:2px 2px 2px 4px;border-radius:var(--r);cursor:pointer}
.wtg-h:hover{background:var(--hover-tint)}
.caret{display:grid;place-items:center;width:20px;height:20px;color:var(--text-tertiary);font-size:11px;transition:transform .4s var(--spring)}
.wtg.closed .caret{transform:rotate(-90deg)}
.wtg-t{display:flex;flex-direction:column;min-width:0;flex:1 1 0;padding-left:2px}
.wtg-t b{font:600 13px/1.25 var(--font-ui);letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-skin=signal] .wtg-t b{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.02em}
.wtg-t span{font:400 11.5px/1.3 var(--font-ui);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtg-acts{position:absolute;right:2px;top:50%;margin-top:-13px;display:flex;padding-left:20px;opacity:0;transform:translateX(6px);pointer-events:none;transition:opacity .2s,transform .3s var(--ease);
  background:linear-gradient(90deg,transparent,var(--hover-tint) 24%),linear-gradient(90deg,transparent,var(--bg-surface) 24%)}
.wtg-h:hover .wtg-acts,.wtg-h:focus-within .wtg-acts{opacity:1;transform:none;pointer-events:auto}
.sum.idle{display:none}
.sum{flex:none;font:500 10.5px/1 var(--font-mono);color:var(--text-secondary);padding:3px 6px;border-radius:var(--r-chip);background:var(--hover-tint);white-space:nowrap;transition:background .3s,color .3s}
.sum.live{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.sum.bad{color:var(--err);background:color-mix(in srgb,var(--err) 14%,transparent)}
.meta-line{display:flex;flex-wrap:wrap;gap:2px 10px;padding:0 6px 2px 28px;font:400 11px/1.4 var(--font-mono);color:var(--text-tertiary)}
.meta-line a{color:var(--text-secondary);text-decoration:none}
.meta-line a:hover{color:var(--accent-text)}

/* collapse (grid rows 0fr→1fr = smooth height) */
.collapse{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s var(--ease),opacity .35s}
.collapse>.in{overflow:hidden;min-height:0}
.closed>.collapse{grid-template-rows:0fr;opacity:0}

/* T3 registration chip — only exists while NOT registered; success state then collapses away */
.t3wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .5s var(--ease),opacity .4s}
.t3wrap>div{overflow:hidden;min-height:0;padding:0 6px 0 28px}
.t3wrap>div>button{margin:1px 0 5px}
.t3wrap.gone{grid-template-rows:0fr;opacity:0;pointer-events:none}
.t3chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 6px;border-radius:var(--r-chip);border:1px dashed var(--border-strong);background:transparent;color:var(--text-secondary);
  font:500 11px/1 var(--font-ui);white-space:nowrap;cursor:pointer;transition:all .3s var(--ease)}
.t3chip:hover{color:var(--text-primary);border-color:var(--text-secondary);background:var(--hover-tint)}
.t3chip .ico{position:relative;width:14px;height:14px;display:grid;place-items:center;font-size:12px}
.t3chip .ico i{position:absolute;transition:all .35s var(--spring)}
.t3chip .ico .spin,.t3chip .ico .check{opacity:0;transform:scale(.3)}
.t3chip[data-state=busy] .ico .plus{opacity:0;transform:scale(.3) rotate(90deg)}
.t3chip[data-state=busy] .ico .spin{opacity:1;transform:none;animation:spin .8s linear infinite}
.t3chip[data-state=done]{border-style:solid;border-color:transparent;color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.t3chip[data-state=done] .ico .plus,.t3chip[data-state=done] .ico .spin{opacity:0;animation:none}
.t3chip[data-state=done] .ico .check{opacity:1;transform:none;animation:pop .45s var(--spring)}
.t3chip .lbl-done{display:none}
.t3chip[data-state=done] .lbl-idle{display:none}.t3chip[data-state=done] .lbl-done{display:inline}

.proj{margin:2px 0 2px 14px;padding-left:8px;border-left:1px solid var(--border-default);transition:border-color .3s}
.wtg:hover .proj{border-left-color:var(--border-strong)}
[data-skin=signal] .proj{border-left-color:var(--border-strong)}
.proj-h{display:flex;align-items:center;gap:6px;height:26px;padding:0 4px;font:600 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary)}
.proj-h .git{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;display:flex;gap:8px}
.proj-h .git b{font-weight:500;color:var(--text-secondary)}
.apps{list-style:none;margin:0;padding:0}
.app-row{position:relative;display:flex;align-items:center;gap:10px;min-height:var(--row-h);padding:4px 4px 4px 8px;border-radius:var(--r);cursor:pointer;transition:background var(--fast)}
.app-row:hover{background:var(--hover-tint)}
.app-row.sel{color:var(--sel-fg)}
.app-row .meta{flex:1;min-width:0;position:relative}
.app-row .nm{font:500 13.5px/1.25 var(--font-ui);color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-row.sel .nm{color:var(--sel-fg)}
[data-skin=signal] .app-row .nm{font-family:var(--font-mono);font-size:12.5px}
.app-row .sub{display:flex;align-items:center;gap:6px;font:400 11.5px/1.3 var(--font-mono);color:var(--text-tertiary);white-space:nowrap}
.app-row.sel .sub{color:color-mix(in srgb,var(--sel-fg) 70%,transparent)}

  if(a.id==='account-web')toast('Account Web is running on :5003')}
async function stop(a){a.state='stopping';refreshAll(a);pushLine('hub','sys',`Stopping ${a.name} (killing process tree)…`);await sleep(900);a.state='stopped';refreshAll(a);pushLine('hub','sys',`${a.name} exited (code 0)`)}
const toggleApp=a=>['stopped','failed'].includes(a.state)?run(a):stop(a);

tree.addEventListener('click',e=>{
  const reg=e.target.closest('[data-t3btn]');if(reg){e.stopPropagation();registerWt(reg.closest('.wtg').dataset.wt);return}
  const head=e.target.closest('[data-toggle]');if(head&&!e.target.closest('.ib')){const g=head.closest('.wtg');g.classList.toggle('closed');setTimeout(resel,60);setTimeout(resel,300);setTimeout(resel,520);return}
  const act=e.target.closest('[data-act]');const row=e.target.closest('.app-row');
  if(act&&row){e.stopPropagation();const a=APPS[row.dataset.app];if(act.dataset.act==='toggle')toggleApp(a);else if(act.dataset.act==='restart'){stop(a).then(()=>run(a))}else if(act.dataset.act==='solo'){S.hidden=new Set(Object.keys(INST).filter(k=>k!=='hub'&&k!==a.id));render();toast('Showing only '+a.name+' · '+a.wt.id)}return}
  if(e.target.closest('[data-port]')){e.preventDefault();return}
  if(row){curApp=row.dataset.app;moveSel(row);const c=$(`.chip[data-src="${curApp}"]`);if(c){c.classList.remove('ping');void c.offsetWidth;c.classList.add('ping')}}
});
tree.addEventListener('transitionend',e=>{if(e.target.classList?.contains('collapse'))resel()});
window.addEventListener('resize',()=>{resel();thumb()});

/* T3 registration: Not in T3 → spinner → green check → chip collapses away */
async function registerWt(wid){const w=WT.find(x=>x.id===wid);if(w.t3)return;const g=$(`[data-wt="${wid}"]`),chip=g.querySelector('[data-t3btn]'),wrap=g.querySelector('.t3wrap');
  if(chip.dataset.state!=='idle')return;chip.dataset.state='busy';await sleep(850);chip.dataset.state='done';w.t3=true;g.querySelector('[data-open]').disabled=false;
  await sleep(1150);wrap.classList.add('gone');refreshBanner();toast(`${wid} added to T3 as a project`)}
$('#regAll').onclick=async()=>{for(const w of WT.filter(x=>!x.t3)){registerWt(w.id);await sleep(420)}};

/* ═════════ TOOLBAR ═════════ */
const OPTS=[{k:'sys',ic:'ph-info',l:'Hub messages'},{k:'time',ic:'ph-clock',l:'Timestamps'},{k:'fw',ic:'ph-stack-simple',l:'Framework stack frames'},{k:'follow',ic:'ph-arrow-line-down',l:'Follow output',kbd:'End'},
  {ic:'ph-download-simple',l:'Export visible lines',fn:()=>toast('Exported '+$$('.row').length+' lines to hub-log.txt')},{ic:'ph-trash',l:'Clear logs',kbd:'Ctrl L',danger:1,fn:()=>{L.length=0;S.sel.clear();sync();render();toast('Logs cleared')}}];
$('#opts').innerHTML=OPTS.map((o,i)=>(i===4?'<span class="sep opt o"></span>':'')+`<button class="ib opt${o.danger?' danger':''}" data-opt="${i}" ${o.k?`aria-pressed="${S[o.k]}"`:''} data-tip="${o.l}" ${o.kbd?`data-kbd="${o.kbd}"`:''} data-side="bottom"><i class="ph ${o.ic}"></i></button>`).join('');
$('#menu').innerHTML=OPTS.map((o,i)=>`<button data-opt="${i}" ${o.k?`aria-pressed="${S[o.k]}"`:''} class="${o.danger?'danger':''}"><i class="ph ${o.ic}"></i>${o.l}${o.k?'<i class="ph-bold ph-check tick"></i>':o.kbd?`<span class="kbd">${o.kbd}</span>`:''}</button>`).join('');
function optClick(i){const o=OPTS[i];if(o.fn){o.fn();return}S[o.k]=!S[o.k];syncOpts();if(o.k==='follow')setFollow(S.follow);else if(o.k==='fw')$$('.trace').forEach(t=>t.classList.toggle('fw',S.fw));else render()}
function syncOpts(){$$('[data-opt]').forEach(b=>{const o=OPTS[+b.dataset.opt];if(o.k)b.setAttribute('aria-pressed',S[o.k])})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-opt]');if(b){optClick(+b.dataset.opt);if(b.closest('#menu'))return}
  const mb=e.target.closest('#more');const menu=$('#menu');
  if(mb){const r=mb.getBoundingClientRect();menu.style.top=r.bottom+8+'px';menu.style.right=innerWidth-r.right+'px';menu.style.left='auto';menu.classList.toggle('on');return}
  if(!e.target.closest('#menu'))menu.classList.remove('on')});
function thumb(){const sg=$('#seg'),t=$('#thumb'),b=$('#seg [aria-pressed=true]');if(!b)return;t.style.width=b.offsetWidth+'px';t.style.transform=`translateX(${b.offsetLeft-2}px)`}
$$('[data-lvl]').forEach(b=>b.onclick=()=>{S.lvl=b.dataset.lvl;$$('[data-lvl]').forEach(x=>x.setAttribute('aria-pressed',x===b));thumb();render()});
$('#q').addEventListener('input',e=>{S.q=e.target.value;render()});
$('#rx').onclick=e=>{S.rx=!S.rx;e.currentTarget.setAttribute('aria-pressed',S.rx);render()};
$('#sources').addEventListener('click',e=>{const c=e.target.closest('[data-src]');if(!c)return;const k=c.dataset.src;S.hidden.has(k)?S.hidden.delete(k):S.hidden.add(k);render()});

/* sidebar toggle: collapse on desktop, drawer on narrow */
const app=$('#app');const narrow=()=>matchMedia('(max-width:899px)').matches;
function toggleSide(){if(narrow())app.classList.toggle('drawer');else app.classList.toggle('collapsed');setTimeout(thumb,520)}
$('#tSide').onclick=toggleSide;$('#scrim').onclick=()=>app.classList.remove('drawer');

/* ═════════ LOG INTERACTIONS ═════════ */
function jumpUI(){$('#jumpf').classList.toggle('on',!S.follow&&S.pending>0&&!S.sel.size);setNum($('#jumpn'),S.pending+' new line'+(S.pending>1?'s':''))}
function setFollow(v){S.follow=v;syncOpts();const lv=$('#live');lv.classList.toggle('off',!v);lv.lastChild.textContent=v?'following':'paused';if(v){S.pending=0;log.classList.add('smooth');log.scrollTop=log.scrollHeight;setTimeout(()=>log.classList.remove('smooth'),600)}jumpUI()}
log.addEventListener('scroll',()=>{const atB=log.scrollHeight-log.scrollTop-log.clientHeight<24;if(atB&&!S.follow)setFollow(true);else if(!atB&&S.follow){S.follow=false;syncOpts();$('#live').classList.add('off');$('#live').lastChild.textContent='paused'}vp()});
$('#jump').onclick=()=>setFollow(true);
const sync=()=>{$('#selc').textContent=S.sel.size+' line'+(S.sel.size>1?'s':'');$('#selbarf').classList.toggle('on',S.sel.size>0);jumpUI()};
log.addEventListener('click',e=>{
  const f=e.target.closest('[data-fold]');if(f){const t=$('#tr'+f.dataset.fold);const o=t.classList.toggle('open');f.setAttribute('aria-expanded',o);return}
  if(e.target.closest('[data-copytrace]')){toast('Stack trace copied');return}
  const a=e.target.closest('[data-act]');if(a){if(a.dataset.act==='fix')toast('Opened thread “Fix CS0246 in Account Web” in T3');else run(APPS['account-web']);return}
  const r=e.target.closest('.row');if(!r||e.target.closest('.trace'))return;const i=+r.dataset.id;S.sel.has(i)?S.sel.delete(i):S.sel.add(i);r.classList.toggle('sel');sync()});
$('#dens').addEventListener('click',e=>{const t=e.target.closest('i[data-id]');if(!t)return;const r=log.querySelector(`.row[data-id="${t.dataset.id}"]`);if(r){S.follow=false;syncOpts();log.classList.add('smooth');log.scrollTop=r.offsetTop-80;setTimeout(()=>log.classList.remove('smooth'),700)}});
$('#selx').onclick=()=>{S.sel.clear();sync();render()};$('#cp').onclick=()=>toast(S.sel.size+' lines copied');
$('#send').onclick=()=>{toast('Sent '+S.sel.size+' lines to the T3 thread for PAYMENT-9986');S.sel.clear();sync();render()};

/* ═════════ SKIN + THEME ═════════ */
function setSkin(s){document.body.dataset.skin=s;$$('#skins button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));updLogo();setTimeout(()=>{thumb();resel()},50)}
function setTheme(t){document.body.classList.add('theming');document.body.className=document.body.className.replace(/\b(dark|light)\b/g,'').trim()+' '+t;$('#themeBtn i').className='ph '+(t==='dark'?'ph-moon':'ph-sun');updLogo();setTimeout(()=>document.body.classList.remove('theming'),450)}
function updLogo(){$('#logo').src='https://static-umbler.s3.us-east-2.amazonaws.com/brand/logos/umbler-simbolo-fundo-'+(document.body.classList.contains('dark')?'escuro':'claro')+'.svg'}
$('#themeBtn').onclick=()=>setTheme(document.body.classList.contains('dark')?'light':'dark');
$('#skins').onclick=e=>{const b=e.target.closest('[data-s]');if(b)setSkin(b.dataset.s)};

/* toast / tooltip */
let tt;function toast(m,kind){const t=$('#toast');t.classList.toggle('warn',kind==='warn');$('#toast i').className=kind==='warn'?'ph-fill ph-warning':'ph-fill ph-check-circle';$('#toastt').textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
const tip=$('#tip');let tTimer,lastHide=0;
function showTip(el){const t=el.dataset.tip;if(!t||!document.contains(el))return;tip.className=el.dataset.kbd?'':'nokbd';
  tip.innerHTML=`<span>${t}</span>`+(el.dataset.kbd?el.dataset.kbd.split(' ').map(k=>`<span class="kbd">${k}</span>`).join(''):'');tip.style.left='0px';tip.style.top='0px';
  const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;let side=el.dataset.side||'bottom';if(side==='bottom'&&r.bottom+h+10>innerHeight)side='top';
  tip.style.left=Math.min(innerWidth-w-8,Math.max(8,r.left+r.width/2-w/2))+'px';tip.style.top=(side==='bottom'?r.bottom+8:r.top-h-8)+'px';requestAnimationFrame(()=>tip.classList.add('on'))}
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');clearTimeout(tTimer);
  if(!el){if(tip.classList.contains('on')){tip.classList.remove('on');lastHide=Date.now()}return}
  tTimer=setTimeout(()=>showTip(el),Date.now()-lastHide<300||tip.classList.contains('on')?0:350)});
document.addEventListener('pointerdown',()=>{clearTimeout(tTimer);tip.classList.remove('on')});
document.addEventListener('focusin',e=>{const el=e.target.closest?.('[data-tip]');if(el&&el.matches(':focus-visible'))showTip(el)});
document.addEventListener('focusout',()=>tip.classList.remove('on'));

/* command palette */
const CMD=[['Run','ph-play','Run Bill API @ PAYMENT-9987',''],['Run','ph-stack','Run stack: Bill API + Worker + Account Web @ PAYMENT-9986','Ctrl Shift R'],['Run','ph-stop','Stop all instances','Ctrl Shift .'],
 ['T3','ph-arrow-square-up-right','Open PAYMENT-9986 in T3 Code','Ctrl O'],['T3','ph-plus-circle','Register all worktrees as T3 projects',''],['T3','ph-sparkle','Send selected log lines to thread',''],
 ['Logs','ph-warning','Jump to next error','F8'],['Logs','ph-trash','Clear logs','Ctrl L'],['Logs','ph-download-simple','Export visible lines…','']];
let pa=0;
function palRender(){const q=$('#pq').value.toLowerCase(),items=CMD.filter(c=>c[2].toLowerCase().includes(q));let g='',h='';
  items.forEach((c,i)=>{if(c[0]!==g){g=c[0];h+=`<li class="grp">${g}</li>`}h+=`<li class="${i===pa?'a':''}" data-i="${i}"><i class="ph ${c[1]}"></i>${c[2]}<span class="k">${c[3].split(' ').filter(Boolean).map(k=>`<span class="kbd">${k}</span>`).join('')}</span></li>`});
  $('#pl').innerHTML=h;return items}
function palOpen(v){$('#pal').classList.toggle('on',v);if(v){$('#pq').value='';pa=0;palRender();setTimeout(()=>$('#pq').focus(),30)}}
$('#openPal').onclick=()=>palOpen(true);
$('#pal').addEventListener('mousedown',e=>{if(e.target.id==='pal')palOpen(false)});
$('#pq').addEventListener('input',()=>{pa=0;palRender()});
$('#pl').addEventListener('click',e=>{const li=e.target.closest('li[data-i]');if(li){toast(li.textContent.trim());palOpen(false)}});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='k'){e.preventDefault();palOpen(!$('#pal').classList.contains('on'));return}
  if((e.ctrlKey||e.metaKey)&&k==='b'){e.preventDefault();toggleSide();return}
  if(e.altKey&&'123'.includes(k)){setSkin(['aurora','panes','signal'][+k-1]);return}
  if($('#pal').classList.contains('on')){const items=palRender();if(k==='escape')palOpen(false);if(k==='arrowdown'){pa=Math.min(items.length-1,pa+1);palRender();e.preventDefault()}
    if(k==='arrowup'){pa=Math.max(0,pa-1);palRender();e.preventDefault()}if(k==='enter'&&items[pa]){toast(items[pa][2]);palOpen(false)}return}
  if(k==='escape'){if(S.sel.size){S.sel.clear();sync();render()}$('#menu').classList.remove('on');app.classList.remove('drawer')}
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus()}
  if(e.key==='End')setFollow(true)});

/* ═════════ BOOT ═════════ */
const qs=new URLSearchParams(location.search);
buildTree();render();setFollow(true);
setSkin(qs.get('skin')||'aurora');if(qs.get('theme')==='light'){document.body.classList.remove('dark');document.body.classList.add('light');$('#themeBtn i').className='ph ph-sun';updLogo()}
setTimeout(()=>{thumb();const r=rowEl(APPS['bill-api']);curApp='bill-api';moveSel(r)},700);
if(narrow())app.classList.remove('drawer');
setInterval(liveLine,1300);
</script>
